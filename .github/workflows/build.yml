name: Build APK + AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Ejecutar pruebas unitarias Debug
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Ejecutar pruebas unitarias Release
        run: ./gradlew testReleaseUnitTest --stacktrace

      - name: Lint Debug (análisis estático)
        run: ./gradlew lintDebug --stacktrace

      - name: Lint Release (análisis estático)
        run: ./gradlew lintRelease --stacktrace

      - name: Verificar manifiesto fusionado Debug
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew processDebugMainManifest --stacktrace
          manifest="$(find app/build/intermediates -type f -path '*merged_manifests/debug*/AndroidManifest.xml' -print -quit)"
          test -n "$manifest"
          echo "Manifiesto fusionado: $manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          grep -q 'android.permission.INTERNET' "$manifest"
          for absent in \
            'FloatingWidgetService' \
            'ThermalMonitorService' \
            'BootReceiver' \
            'NotificationActionReceiver' \
            'android.permission.SYSTEM_ALERT_WINDOW' \
            'android.permission.PACKAGE_USAGE_STATS' \
            'android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS' \
            'android.permission.BATTERY_STATS' \
            'android.permission.KILL_BACKGROUND_PROCESSES' \
            'android.permission.BIND_ACCESSIBILITY_SERVICE' \
            'android.permission.WRITE_SECURE_SETTINGS' \
            'android.permission.READ_LOGS' \
            'android.permission.DEVICE_POWER' \
            'android.permission.HARDWARE_TEST'; do
            if grep -Fq "$absent" "$manifest"; then
              echo "Unexpected manifest entry: $absent" >&2
              exit 1
            fi
          done

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Compilar APK Release y AAB Release
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verificar reproducibilidad y generar checksums
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/release/app-release.apk"
          mkdir -p ci/artifacts
          canonicalize() {
            python3 - "$1" "$2" <<'PY'
import sys, zipfile
source, target = sys.argv[1:]
fixed = (1980, 1, 1, 0, 0, 0)
with zipfile.ZipFile(source) as src, zipfile.ZipFile(target, 'w') as dst:
    dst.comment = b''
    for original in src.infolist():
        info = zipfile.ZipInfo(original.filename, fixed)
        info.compress_type = original.compress_type
        info.external_attr = original.external_attr
        info.create_system = original.create_system
        info.create_version = original.create_version
        info.extract_version = original.extract_version
        info.flag_bits = original.flag_bits & 0x800
        dst.writestr(info, src.read(original.filename))
PY
            aligned="$2.aligned"
            zipalign -f 4 "$2" "$aligned"
            mv "$aligned" "$2"
          }
          ./gradlew clean assembleRelease --stacktrace
          test -s "$apk"
          canonicalize "$apk" ci/artifacts/.ThermaGuard-release-first.apk
          first_hash="$(sha256sum ci/artifacts/.ThermaGuard-release-first.apk | awk '{print $1}')"
          ./gradlew clean assembleRelease --stacktrace
          test -s "$apk"
          canonicalize "$apk" ci/artifacts/ThermaGuard-release.apk
          second_hash="$(sha256sum ci/artifacts/ThermaGuard-release.apk | awk '{print $1}')"
          printf 'Canonical APK hashes: first=%s second=%s\n' "$first_hash" "$second_hash"
          cmp --silent ci/artifacts/.ThermaGuard-release-first.apk ci/artifacts/ThermaGuard-release.apk
          rm ci/artifacts/.ThermaGuard-release-first.apk
          cp app/build/outputs/bundle/release/app-release.aab ci/artifacts/ThermaGuard-release.aab
          cp app/build/outputs/bundle/release/app-release.aab ci/artifacts/ThermaGuard-release.aab
          sha256sum ci/artifacts/ThermaGuard-release.apk > ci/artifacts/ThermaGuard-release.apk.sha256
          sha256sum ci/artifacts/ThermaGuard-release.aab > ci/artifacts/ThermaGuard-release.aab.sha256
          printf 'APK SHA-256: %s\nAAB SHA-256: %s\n' "$second_hash" "$(cut -d' ' -f1 ci/artifacts/ThermaGuard-release.aab.sha256)"

      - name: Subir APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: ThermaGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Subir APK/AAB Release y checksums
        uses: actions/upload-artifact@v4
        with:
          name: ThermaGuard-release-artifacts
          path: ci/artifacts/*
          if-no-files-found: error
          retention-days: 30
